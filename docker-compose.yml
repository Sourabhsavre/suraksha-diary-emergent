services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_GOOGLE_AUTH_URL: ${REACT_APP_GOOGLE_AUTH_URL:-https://auth.emergentagent.com/}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped